name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — the action reads package.json's
      # `packageManager` field, and specifying both makes it fail outright
      # rather than pick one.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # dist/ is committed (consumers use a git submodule + `file:` dep, which
      # never runs `prepare`). A stale dist would ship silently, so fail here
      # instead: rebuild and require the tree to be unchanged.
      - name: Committed dist/ matches the source
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi

      - run: pnpm test
